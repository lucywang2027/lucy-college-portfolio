<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Asian Night Design | Lucy Wang</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .project-page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 50px 24px 80px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 35px;
      text-decoration: none;
      color: #243b6b;
      font-size: 18px;
    }

    .project-page h1 {
      color: #243b6b;
      margin-bottom: 10px;
    }

    .project-description {
      color: #666;
      margin-bottom: 40px;
      font-size: 17px;
    }

    .project-images {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }

    .project-image img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 14px;
    }

    .project-image h3 {
      margin-top: 14px;
      color: #243b6b;
    }

    @media (max-width: 700px) {
      .project-images {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <main class="project-page">

    <a href="art.html" class="back-link">← Back to Art Portfolio</a>

    <h1>Asian Night Design</h1>

    <p class="project-description">
      Digital drawing on iPad · School Asian Night design · 2025
    </p>

    <div class="project-images">

      <div class="project-image">
        <img src="images/asian-night-design.jpg"
             alt="Original Asian Night design">
        <h3>Original Design</h3>
      </div>

      <div class="project-image">
        <img src="images/asian-night-shirt.jpg"
             alt="Asian Night design applied to a T-shirt">
        <h3>T-Shirt Mockup</h3>
      </div>

    </div>

  </main>

</body>
</html>
